
{% extends 'base.html' %}

{% block title %}Изтриване на съставка | PlatePlotter{% endblock %}

{% block content %}
<h1>Изтриване на съставка</h1>

<p>
    Сигурен ли си, че искаш да премахнеш
    <strong>{{ object.product.name }}</strong>
    от рецептата?
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
        Да, изтрий
    </button>

    <a href="{% url 'dish-detail' object.dish.pk %}"
       class="btn btn-secondary">
        Отказ
    </a>
</form>
{% endblock %}
