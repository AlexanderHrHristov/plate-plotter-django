{% if messages %}
    {% for message in messages %}
        <div
            class="alert
                {% if message.tags == 'error' %}
                    alert-danger
                {% elif message.tags == 'success' %}
                    alert-success
                {% elif message.tags == 'warning' %}
                    alert-warning
                {% else %}
                    alert-info
                {% endif %}
            "
            role="alert"
        >
            {{ message }}
        </div>
    {% endfor %}
{% endif %}
