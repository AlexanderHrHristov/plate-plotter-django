{% extends 'base.html' %} 
{% load static %} 

{% block title %}Начало | PlatePlotter{% endblock %} 

{% block content %}

<section class="home-hero">
  <div class="home-overlay">
    <h1 class="display-4 fw-bold mb-3">Добре дошли в PlatePlotter!</h1>

    <p class="fs-4 mb-0">
      Организирай продуктите, наличностите и любимите си рецепти.
    </p>
  </div>
</section>

<style>
  .home-hero {
    min-height: 600px;
    background-image: url("{% static 'images/home.png' %}");
    background-size: cover;
    background-position: center;
    border-radius: 12px;

    display: flex;
    align-items: center;

    padding: 4rem;
  }

  .home-overlay {
    background-color: rgba(0, 0, 0, 0.6);
    color: white;
    padding: 2.5rem;
    border-radius: 12px;
    max-width: 850px;
  }

  @media (max-width: 768px) {
    .home-hero {
      min-height: 450px;
      padding: 1rem;
    }

    .home-overlay {
      padding: 1.5rem;
    }

    .home-overlay h1 {
      font-size: 2rem;
    }

    .home-overlay p {
      font-size: 1.1rem !important;
    }
  }
</style>

{% endblock %}
